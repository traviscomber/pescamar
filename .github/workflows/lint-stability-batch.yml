name: Guarded hook stability batch

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/lint-stability-batch.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Apply exact stability cleanups
        run: |
          node <<'NODE'
          const fs=require('node:fs')
          function exact(path,oldText,newText){
            const source=fs.readFileSync(path,'utf8')
            const matches=source.split(oldText).length-1
            if(matches!==1)throw new Error(`Expected exactly one match in ${path}, got ${matches}: ${oldText.slice(0,100)}`)
            fs.writeFileSync(path,source.replace(oldText,newText))
            console.log(`updated ${path}`)
          }
          exact('src/pages/Inventory.tsx',
            "  const allLots=data?.lots??[],allLocations=data?.locations??[],allMovements=data?.movements??[]",
            "  const allLots=useMemo(()=>data?.lots??[],[data?.lots]),allLocations=useMemo(()=>data?.locations??[],[data?.locations]),allMovements=useMemo(()=>data?.movements??[],[data?.movements])")
          exact('src/pages/LabelPrintControl.tsx',
            "jobs=engine?.jobs??[]",
            "jobs=useMemo(()=>engine?.jobs??[],[engine?.jobs])")
          exact('src/pages/PlantExecutionControl.tsx',
            "units=unitData?.units??[]",
            "units=useMemo(()=>unitData?.units??[],[unitData?.units])")
          exact('src/pages/PlantStations.tsx',
            " const stations=data?.stations??[]",
            " const stations=useMemo(()=>data?.stations??[],[data?.stations])")
          exact('src/pages/ProductLabels.tsx',
            "allLots=data?.lots??[]",
            "allLots=useMemo(()=>data?.lots??[],[data?.lots])")
          exact('src/pages/ProductLabels.tsx',
            "releases=data?.releases??[]",
            "releases=useMemo(()=>data?.releases??[],[data?.releases])")
          exact('src/pages/Profitability.tsx',
            " const liveRows=view==='supplier'?data?.live?.suppliers??[]:view==='plant'?data?.live?.plants??[]:data?.live?.customers??[]",
            " const liveRows=useMemo(()=>view==='supplier'?data?.live?.suppliers??[]:view==='plant'?data?.live?.plants??[]:data?.live?.customers??[],[view,data?.live?.suppliers,data?.live?.plants,data?.live?.customers])")
          exact('src/pages/SeaUrchinFocus.tsx',
            " const runs=data?.runs??[],candidates=data?.candidates??[],summary=calibration?.summary",
            " const runs=useMemo(()=>data?.runs??[],[data?.runs]),candidates=data?.candidates??[],summary=calibration?.summary")
          exact('src/pages/SeaUrchinProcess.tsx',
            " const runs=data?.runs??[],candidates=data?.candidates??[],documents=data?.documents??[],run=runs.find(r=>r.reception_id===selectedId)??null,candidate=candidates.find(c=>c.id===selectedId)??null",
            " const runs=useMemo(()=>data?.runs??[],[data?.runs]),candidates=data?.candidates??[],documents=data?.documents??[],run=runs.find(r=>r.reception_id===selectedId)??null,candidate=candidates.find(c=>c.id===selectedId)??null")
          exact('src/pages/TransformationCosts.tsx',
            " const costs=data?.costs??[]",
            " const costs=useMemo(()=>data?.costs??[],[data?.costs])")
          exact('src/components/UniVisionStation.tsx',
            " const captures=data?.captures??[],latest=saved??captures[0]??null,references=data?.references??[],canCapture=data?.permissions?.canCapture??data?.permissions?.canWrite??false,canConfirm=data?.permissions?.canConfirm??false",
            " const captures=useMemo(()=>data?.captures??[],[data?.captures]),latest=saved??captures[0]??null,references=data?.references??[],canCapture=data?.permissions?.canCapture??data?.permissions?.canWrite??false,canConfirm=data?.permissions?.canConfirm??false")
          NODE
      - name: Verify quality
        run: npm run quality
      - name: Commit verified cleanup
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'lint: stabilize hook collection dependencies'
          git push origin HEAD:main
