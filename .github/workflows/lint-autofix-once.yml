name: One-shot lint autofix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/lint-autofix-once.yml'

permissions:
  contents: write

jobs:
  autofix:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Setup Node
        uses: actions/setup-node@v7.0.0
        with:
          node-version: 24
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Apply ESLint safe fixes
        run: |
          npx eslint . --fix
          git diff --binary > /tmp/eslint-fixes.patch
      - name: Rebase fixes onto latest main
        run: |
          if [ ! -s /tmp/eslint-fixes.patch ]; then
            echo 'No autofixable lint changes.'
            exit 0
          fi
          git reset --hard
          git fetch origin main
          git checkout -B main origin/main
          git apply /tmp/eslint-fixes.patch
      - name: Verify build
        run: npm run build
      - name: Commit safe fixes
        run: |
          if git diff --quiet; then
            echo 'No autofixable lint changes.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'lint: apply safe eslint autofixes'
          git push origin HEAD:main
