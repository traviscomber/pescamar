name: Quality

on:
  pull_request:
    branches:
      - main
      - 'feat/**'
      - 'docs/**'
  push:
    branches: [main]

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Lint, typecheck and build
        run: npm run quality
      - name: Migration inventory contract
        run: node scripts/migration-inventory-smoke.mjs
      - name: Start production preview
        run: |
          npm run preview -- --host 127.0.0.1 > /tmp/pescamar-preview.log 2>&1 &
          echo $! > /tmp/pescamar-preview.pid
      - name: Wait for production preview
        run: |
          for i in {1..20}; do
            if curl --fail --silent http://127.0.0.1:4173/ > /dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/pescamar-preview.log
          exit 1
      - name: Release smoke
        run: node scripts/release-smoke.mjs
      - name: Seafood lineage contract
        run: node scripts/seafood-lineage-smoke.mjs
      - name: EdgeVision foundation contract
        run: node scripts/edgevision-foundation-smoke.mjs
      - name: Organization context contract
        run: node scripts/organization-context-smoke.mjs
      - name: Integration data plane contract
        run: node scripts/integration-data-plane-smoke.mjs
      - name: Seafood AI foundation contract
        run: node scripts/seafood-ai-smoke.mjs
      - name: Operational form safety
        run: node scripts/form-safety-smoke.mjs
      - name: Stable operator identity
        run: node scripts/operator-identity-smoke.mjs
      - name: Operational audit contracts
        run: node scripts/audit-smoke.mjs
      - name: Install pinned browser test runtime
        run: |
          npm install --no-save --ignore-scripts @playwright/test@1.55.0
          npx playwright install --with-deps chromium
      - name: Desktop and mobile Chromium smoke
        run: npx playwright test
      - name: Publish browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-release-evidence
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 14
      - name: Preview logs on failure
        if: failure()
        run: cat /tmp/pescamar-preview.log || true
