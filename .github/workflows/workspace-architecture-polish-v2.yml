name: Guarded workspace architecture polish v2
on:
  push:
    branches: [main]
    paths: ['.github/workflows/workspace-architecture-polish-v2.yml']
permissions:
  contents: write
jobs:
  polish:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Apply workspace ownership
        run: |
          node <<'NODE'
          const fs=require('node:fs')
          const path='src/components/AppShell.tsx'
          let s=fs.readFileSync(path,'utf8')
          function once(from,to){const n=s.split(from).length-1;if(n!==1)throw new Error(`Expected one match, got ${n}: ${from}`);s=s.replace(from,to)}
          once('const intelligencePaths=["/pescamar-ia","/lineage","/rentabilidad","/edgevision","/timeline"];','const intelligencePaths=["/pescamar-ia","/lineage","/rentabilidad"];')
          once(' commercial:[\n  {to:"/ordenes-venta",label:"Órdenes",step:1},\n  {to:"/proveedores-clientes",label:"Proveedores",step:2},\n  {to:"/despachos-ventas",label:"Despacho",step:3},\n  {to:"/liquidaciones",label:"Liquidación",step:4},\n ],',' commercial:[\n  {to:"/ordenes-venta",label:"Órdenes",step:1},\n  {to:"/despachos-ventas",label:"Despacho",step:2},\n  {to:"/liquidaciones",label:"Liquidación",step:3},\n ],')
          fs.writeFileSync(path,s)
          NODE
      - run: npm run quality
      - name: Commit verified workspace polish
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/components/AppShell.tsx
          git commit -m 'refactor: simplify commercial and admin workspace ownership'
          git push origin HEAD:main
