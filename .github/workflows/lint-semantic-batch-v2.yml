name: Guarded semantic hook cleanup v2
on:
  push:
    branches: [main]
    paths: ['.github/workflows/lint-semantic-batch-v2.yml']
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Apply semantic fixes
        run: |
          node <<'NODE'
          const fs=require('node:fs')
          function exact(path,oldText,newText){const s=fs.readFileSync(path,'utf8'),n=s.split(oldText).length-1;if(n!==1)throw new Error(`${path}: expected 1 match, got ${n}: ${oldText.slice(0,120)}`);fs.writeFileSync(path,s.replace(oldText,newText));console.log(`updated ${path}`)}
          function transformLine(path,startMarker,endMarker,transform){let s=fs.readFileSync(path,'utf8');const start=s.indexOf(startMarker);if(start<0)throw new Error(`${path}: start marker missing`);const end=s.indexOf(endMarker,start);if(end<0)throw new Error(`${path}: end marker missing`);const original=s.slice(start,end);const changed=transform(original);if(changed===original)throw new Error(`${path}: transform produced no change`);s=s.slice(0,start)+changed+s.slice(end);fs.writeFileSync(path,s);console.log(`updated ${path}`)}

          exact('src/components/UniVisionStation.tsx',"import {useEffect,useMemo,useRef,useState,type ChangeEvent} from 'react'","import {useCallback,useEffect,useMemo,useRef,useState,type ChangeEvent} from 'react'")
          exact('src/components/UniVisionStation.tsx'," async function load(){try{const response=await fetch(`/api/sea-urchin-color?runId=${encodeURIComponent(runId)}`,{cache:'no-store'}),payload=await response.json() as Payload;if(!response.ok)throw new Error(payload.error??'No fue posible cargar Uni Vision');setData(payload);setError('')}catch(cause){setError(cause instanceof Error?cause.message:'No fue posible cargar Uni Vision')}}\n useEffect(()=>{void load();return()=>stopCamera()},[runId])"," const load=useCallback(async()=>{try{const response=await fetch(`/api/sea-urchin-color?runId=${encodeURIComponent(runId)}`,{cache:'no-store'}),payload=await response.json() as Payload;if(!response.ok)throw new Error(payload.error??'No fue posible cargar Uni Vision');setData(payload);setError('')}catch(cause){setError(cause instanceof Error?cause.message:'No fue posible cargar Uni Vision')}},[runId])\n useEffect(()=>{void load();return()=>stopCamera()},[load])")

          exact('src/pages/SeaUrchinProcess.tsx',"import {useEffect,useMemo,useState} from 'react'","import {useCallback,useEffect,useMemo,useState} from 'react'")
          exact('src/pages/SeaUrchinProcess.tsx'," async function load(){setLoading(true);try{const q=plantId?`?plantId=${encodeURIComponent(plantId)}`:'',r=await fetch(`/api/sea-urchin-process${q}`,{cache:'no-store'}),p=await r.json() as Payload;if(!r.ok)throw new Error(p.error??'No fue posible cargar proceso de erizo');setData(p);setError('');const runs=p.runs??[],candidates=p.candidates??[];if(requested&&(runs.some(x=>x.reception_id===requested)||candidates.some(x=>x.id===requested)))setSelectedId(requested);else if(!selectedId&&runs[0])setSelectedId(runs[0].reception_id)}catch(e){setError(e instanceof Error?e.message:'No fue posible cargar proceso de erizo')}finally{setLoading(false)}}\n useEffect(()=>{void load()},[plantId])"," const load=useCallback(async()=>{setLoading(true);try{const q=plantId?`?plantId=${encodeURIComponent(plantId)}`:'',r=await fetch(`/api/sea-urchin-process${q}`,{cache:'no-store'}),p=await r.json() as Payload;if(!r.ok)throw new Error(p.error??'No fue posible cargar proceso de erizo');setData(p);setError('');const nextRuns=p.runs??[],candidates=p.candidates??[];setSelectedId(current=>requested&&(nextRuns.some(x=>x.reception_id===requested)||candidates.some(x=>x.id===requested))?requested:current||nextRuns[0]?.reception_id||'')}catch(e){setError(e instanceof Error?e.message:'No fue posible cargar proceso de erizo')}finally{setLoading(false)}},[plantId,requested])\n useEffect(()=>{void load()},[load])")

          exact('src/pages/DailyCloseAdvanced.tsx',"import {useEffect,useMemo,useState} from 'react'","import {useCallback,useEffect,useMemo,useState} from 'react'")
          exact('src/pages/DailyCloseAdvanced.tsx'," async function load(nextDate=date,nextPlant=plantId){setLoading(true);try{const q=new URLSearchParams({date:nextDate});if(nextPlant)q.set('plantId',nextPlant);const [daily,performance]=await Promise.all([fetch(`/api/daily-close?${q}`,{cache:'no-store'}).then(async r=>{const p=await r.json() as Payload;if(!r.ok)throw new Error(p.error??'No fue posible construir el estado del día');return p}),operator?.role==='admin'?fetch('/api/plant-performance',{cache:'no-store'}).then(async r=>r.ok?await r.json() as PlantPerformancePayload:{plants:[],historicalPlants:[]}):Promise.resolve({plants:[],historicalPlants:[]} as PlantPerformancePayload)]);setData(daily);setPlantPerformance(performance.plants??[]);setHistoricalPlants(performance.historicalPlants??[]);setNotes(daily.saved?.notes??'');setError('')}catch(e){setError(e instanceof Error?e.message:'No fue posible construir el estado del día')}finally{setLoading(false)}}\n useEffect(()=>{setPlantId(defaultPlant);void load(date,defaultPlant)},[defaultPlant])"," const load=useCallback(async(nextDate:string,nextPlant:string)=>{setLoading(true);try{const q=new URLSearchParams({date:nextDate});if(nextPlant)q.set('plantId',nextPlant);const [daily,performance]=await Promise.all([fetch(`/api/daily-close?${q}`,{cache:'no-store'}).then(async r=>{const p=await r.json() as Payload;if(!r.ok)throw new Error(p.error??'No fue posible construir el estado del día');return p}),operator?.role==='admin'?fetch('/api/plant-performance',{cache:'no-store'}).then(async r=>r.ok?await r.json() as PlantPerformancePayload:{plants:[],historicalPlants:[]}):Promise.resolve({plants:[],historicalPlants:[]} as PlantPerformancePayload)]);setData(daily);setPlantPerformance(performance.plants??[]);setHistoricalPlants(performance.historicalPlants??[]);setNotes(daily.saved?.notes??'');setError('')}catch(e){setError(e instanceof Error?e.message:'No fue posible construir el estado del día')}finally{setLoading(false)}},[operator?.role])\n useEffect(()=>{setPlantId(defaultPlant)},[defaultPlant])\n useEffect(()=>{void load(date,plantId)},[date,plantId,load])")
          exact('src/pages/DailyCloseAdvanced.tsx',"await load()}catch(e){setError(e instanceof Error?e.message:'No fue posible cerrar el día')}","await load(date,plantId)}catch(e){setError(e instanceof Error?e.message:'No fue posible cerrar el día')}")
          exact('src/pages/DailyCloseAdvanced.tsx',"<label className=\"inline-field\">Fecha<input type=\"date\" value={date} onChange={e=>{setDate(e.target.value);void load(e.target.value,plantId)}}/></label><label className=\"inline-field\">Planta<select value={plantId} onChange={e=>{const next=e.target.value;setPlantId(next);void load(date,next)}}>","<label className=\"inline-field\">Fecha<input type=\"date\" value={date} onChange={e=>setDate(e.target.value)}/></label><label className=\"inline-field\">Planta<select value={plantId} onChange={e=>setPlantId(e.target.value)}>")
          exact('src/pages/DailyCloseAdvanced.tsx',"<button className=\"button\" onClick={()=>void load()}><RefreshCw size={15}/>Actualizar</button>","<button className=\"button\" onClick={()=>void load(date,plantId)}><RefreshCw size={15}/>Actualizar</button>")

          exact('src/pages/PlantControl.tsx',"import {useEffect,useMemo,useState} from \"react\";","import {useCallback,useEffect,useMemo,useState} from \"react\";")
          exact('src/pages/PlantControl.tsx',"const{plantId}=useParams();const navigate=useNavigate();const{operator}=useAuth();const canManage=operator?.role==='admin';const fallbackPlants=operator?.role==='admin'?configuredPlants:configuredPlants.filter(plant=>operator?.plantIds.includes(plant.id));","const{plantId}=useParams();const navigate=useNavigate();const{operator}=useAuth();const canManage=operator?.role==='admin';const fallbackPlants=useMemo(()=>operator?.role==='admin'?configuredPlants:configuredPlants.filter(plant=>operator?.plantIds.includes(plant.id)),[operator]);")
          transformLine('src/pages/PlantControl.tsx',' async function load(){','\n const publish=',line=>{if(!line.endsWith("useEffect(()=>{void load()},[]);"))throw new Error('PlantControl load suffix changed');const body=line.slice(" async function load(){".length,-"useEffect(()=>{void load()},[]);".length);if(!body.endsWith('}'))throw new Error('PlantControl load body malformed');return ` const load=useCallback(async()=>{${body.slice(0,-1)}},[fallbackPlants]);useEffect(()=>{void load()},[load]);`})

          exact('src/pages/SalesOrders.tsx',"import {useEffect,useMemo,useRef,useState,type FormEvent} from 'react'","import {useCallback,useEffect,useMemo,useRef,useState,type FormEvent} from 'react'")
          exact('src/pages/SalesOrders.tsx',"const allOrders=data?.orders??[],allLots=data?.lots??[],orders=requestedPlantId?allOrders.filter(o=>o.plant_id===requestedPlantId):allOrders,lots=requestedPlantId?allLots.filter(l=>l.plant_id===requestedPlantId):allLots,contextLot=","const allOrders=useMemo(()=>data?.orders??[],[data?.orders]),allLots=useMemo(()=>data?.lots??[],[data?.lots]),orders=requestedPlantId?allOrders.filter(o=>o.plant_id===requestedPlantId):allOrders,contextLot=")
          transformLine('src/pages/SalesOrders.tsx','  function startAllocate(order:Order){','\n  useEffect(()=>{if(deepLinkHandled.current',line=>{const prefix='  function startAllocate(order:Order){';if(!line.startsWith(prefix)||!line.endsWith('}'))throw new Error('SalesOrders startAllocate shape changed');const body=line.slice(prefix.length,-1);return `  const startAllocate=useCallback((order:Order)=>{${body}},[allLots,requestedPlantId,requestedReceptionId])`})
          exact('src/pages/SalesOrders.tsx',"},[allOrders,requestedOrderId,requestedAction,requestedPlantId,data?.permissions?.canWrite])","},[allOrders,requestedOrderId,requestedAction,requestedPlantId,data?.permissions?.canWrite,startAllocate])")

          exact('src/components/SeaUrchinAssistant.tsx',"import {useEffect,useMemo,useRef,useState,type ChangeEvent,type ClipboardEvent,type DragEvent,type FormEvent} from 'react'","import {useCallback,useEffect,useMemo,useRef,useState,type ChangeEvent,type ClipboardEvent,type DragEvent,type FormEvent} from 'react'")
          exact('src/components/SeaUrchinAssistant.tsx',"[pendingCapture?.id,pendingCapture?.operator_grade,pendingCapture?.suggested_grade,card?.process?.grade]","[pendingCapture,card?.process?.grade]")
          transformLine('src/components/SeaUrchinAssistant.tsx',' async function ask(value=question){','\n useEffect(()=>{if(!autoAnalyzeRef.current',line=>{const prefix=' async function ask(value=question){';if(!line.startsWith(prefix)||!line.endsWith('}'))throw new Error('SeaUrchinAssistant ask shape changed');const body=line.slice(prefix.length,-1);return ` const ask=useCallback(async(value=question)=>{${body}},[loading,photos,plantId,question,receptionId,turns])`})
          exact('src/components/SeaUrchinAssistant.tsx',"},[photos.length])","},[photos.length,loading,ask])")

          exact('src/os.ts',"{path:'/pescamar-ia',label:'Inteligencia',description:'Seafood AI para preguntas sobre la operación y evidencia canónica'}","{path:'/pescamar-ia',label:'Seafood AI',description:'Preguntas sobre la operación y evidencia canónica'}")
          NODE
      - name: Verify zero-warning quality
        run: |
          npm run lint -- --max-warnings 0
          npm run build
      - name: Commit verified cleanup
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/components/UniVisionStation.tsx src/pages/SeaUrchinProcess.tsx src/pages/DailyCloseAdvanced.tsx src/pages/PlantControl.tsx src/pages/SalesOrders.tsx src/components/SeaUrchinAssistant.tsx src/os.ts
          git commit -m 'refactor: finish warning-free product semantics'
          git push origin HEAD:main
